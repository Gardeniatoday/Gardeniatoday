<script>
  (function() {
    // التحقق إذا كان الزائر أول مرة
    const hasVisited = localStorage.getItem('gardenia_once_shown');
    
    // عناصر الهيدر والفوتر
    const header = document.getElementById('once-header');
    const footer = document.getElementById('once-footer');
    
    if (!hasVisited) {
      // أول مرة - أظهر الهيدر والفوتر
      header.style.display = 'block';
      footer.style.display = 'block';
      
      // Auto-hide after 15 seconds
      setTimeout(function() {
        header.classList.add('hidden');
        footer.classList.add('hidden');
      }, 15000); // 15 ثانية كافية عشان Google تشوفهم
      
      // Close buttons
      document.getElementById('header-close').addEventListener('click', function() {
        header.classList.add('hidden');
      });
      
      document.getElementById('footer-close').addEventListener('click', function() {
        footer.classList.add('hidden');
      });
      
      // حفظ في localStorage إنه شافهم
      localStorage.setItem('gardenia_once_shown', 'true');
    } else {
      // مش أول مرة - اخفيهم تماماً
      header.style.display = 'none';
      footer.style.display = 'none';
    }
  })();
</script>

<!-- Ensure footer stays on top and adjust splash padding -->
<script>

        splashContent.style.paddingTop = '70px';
        splashContent.style.paddingBottom = '70px';
      }
    }, 100);
  });
</script>
